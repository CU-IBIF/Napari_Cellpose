[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibif-napari"
version = "0.18.0"
description = "napari with Nikon ND2, Zeiss CZI and Leica LIF support, a dimension panel, 3D Cellpose (local, facility GPU server or GPU cluster) and a filament tracer built in"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "napari[all]>=0.5",
    "nd2>=0.10",
    "bioio-czi>=2",
    "bioio-lif>=1",
    "dask[array]",
    "numpy",
    "qtpy",
    "cellpose>=3.0",
    # Filament Tracer panel
    "scikit-image>=0.22",
    "scipy",
    "pandas",
    "networkx",
    "skan>=0.12",
    # Filament plugins that also appear under Plugins: click-to-trace with SWC files,
    # and 2D spline tracing of single filaments (Python 3.11+ only)
    "napari-tracing",
    "napari-filaments; python_version >= '3.11'",
    "paramiko>=3.2",
    # Cytometry: VTEA's headless analysis library (gates, phenotype trees, clustering,
    # neighbourhoods). Not on PyPI yet, so installed from its repository at a fixed commit.
    "vtea-core @ git+https://github.com/winfrees/vtea-python@9401d685f2b331c770cb733bc342f9b16d51cf70#subdirectory=packages/vtea-core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt"]
# V&V suite: plots and TIFF files (installed with napari[all] anyway)
vv = ["matplotlib", "tifffile"]

[project.scripts]
ibif-napari = "ibif_napari.launcher:main"
ibif-napari-server = "ibif_napari._server:main"
ibif-napari-cluster = "ibif_napari._cluster:main"
ibif-napari-vv = "ibif_napari.vv.cli:main"

[project.entry-points."napari.manifest"]
ibif-napari = "ibif_napari:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibif_napari = ["napari.yaml", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
