[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibif-napari"
version = "0.6.0"
description = "napari with Nikon ND2, Zeiss CZI and Leica LIF support, a dimension panel and 3D Cellpose built in"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "napari[all]>=0.5",
    "nd2>=0.10",
    "bioio-czi>=2",
    "bioio-lif>=1",
    "dask[array]",
    "numpy",
    "qtpy",
    "cellpose>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt"]

[project.scripts]
ibif-napari = "ibif_napari.launcher:main"

[project.entry-points."napari.manifest"]
ibif-napari = "ibif_napari:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibif_napari = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
