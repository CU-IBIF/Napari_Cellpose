[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibif-napari"
version = "0.30.0"
description = "napari with Nikon ND2, Zeiss CZI and Leica LIF support, a dimension panel, 3D Cellpose (local, facility GPU server or GPU cluster) and a filament tracer built in"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # napari[all] 0.8+ needs zarr>=3, but vtea-core still needs zarr<3. Without this cap pip
    # backtracks through every napari release (and every plugin release beneath it) and fails
    # with "resolution-too-deep". Lift it once vtea-core supports zarr 3.
    "napari[all]>=0.7.1,<0.8",
    "nd2>=0.10",
    "bioio-czi>=2",
    "bioio-lif>=1",
    "dask[array]",
    "numpy",
    "qtpy",
    "cellpose>=3.0",
    # Filament Tracer panel
    "scikit-image>=0.22",
    "scipy",
    "pandas",
    "networkx",
    "skan>=0.12",
    # Filament plugins that also appear under Plugins: click-to-trace with SWC files,
    # and 2D spline tracing of single filaments (Python 3.11+ only)
    # Floors on these plugins and their helper libraries keep pip from backtracking through
    # dozens of old releases (several are source-only and get built just to read metadata),
    # which ends in "resolution-too-deep" on macOS.
    "napari-tracing>=1.0.2",
    "brightest-path-lib>=1.0.57",
    "napari-filaments>=0.5.2; python_version >= '3.11'",
    "magic-class>=0.7.24; python_version >= '3.11'",
    "macro-kit>=0.4.10; python_version >= '3.11'",
    "paramiko>=3.2",
    # Cytometry: VTEA's headless analysis library (gates, phenotype trees, clustering,
    # neighbourhoods), with UMAP and Leiden/Louvain. Not on PyPI yet, so installed from its
    # repository at a fixed commit.
    "vtea-core[graph,umap,opentsne] @ git+https://github.com/winfrees/vtea-python@e660ae5b40d3447cb4ce9dda370ae5c348e1ea84#subdirectory=packages/vtea-core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt"]
# V&V suite: plots and TIFF files (installed with napari[all] anyway)
vv = ["matplotlib", "tifffile"]

[project.scripts]
ibif-napari = "ibif_napari.launcher:main"
ibif-napari-server = "ibif_napari._server:main"
ibif-napari-cluster = "ibif_napari._cluster:main"
ibif-napari-vv = "ibif_napari.vv.cli:main"

[project.entry-points."napari.manifest"]
ibif-napari = "ibif_napari:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibif_napari = ["napari.yaml", "icons/*.png", "manual/*.md", "manual/images/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
