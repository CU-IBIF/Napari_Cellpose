name: ibif-napari
display_name: IBIF napari
contributions:
  commands:
    - id: ibif-napari.get_reader
      python_name: ibif_napari._reader:napari_get_reader
      title: Open Nikon ND2 / Zeiss CZI / Leica LIF
    - id: ibif-napari.dims_widget
      python_name: ibif_napari._dims_widget:DimensionsWidget
      title: Dimensions
    - id: ibif-napari.cellpose_widget
      python_name: ibif_napari._cellpose_widget:CellposeWidget
      title: Cellpose 3D
    - id: ibif-napari.filament_widget
      python_name: ibif_napari._filament_widget:FilamentWidget
      title: Filament Tracer
    - id: ibif-napari.secondary_widget
      python_name: ibif_napari._secondary_widget:SecondaryWidget
      title: Secondary objects
    - id: ibif-napari.measure_widget
      python_name: ibif_napari._measure_widget:MeasureWidget
      title: Measurements
    - id: ibif-napari.workspace_widget
      python_name: ibif_napari._workspace_widget:WorkspaceWidget
      title: Workspace
    - id: ibif-napari.get_workspace_reader
      python_name: ibif_napari._workspace:napari_get_reader
      title: Open IBIF workspace
  readers:
    - command: ibif-napari.get_reader
      filename_patterns: ["*.nd2", "*.czi", "*.lif"]
      accepts_directories: false
    - command: ibif-napari.get_workspace_reader
      filename_patterns: ["*.ibif"]
      accepts_directories: true
  widgets:
    - command: ibif-napari.dims_widget
      display_name: Dimensions
    - command: ibif-napari.cellpose_widget
      display_name: Cellpose 3D
    - command: ibif-napari.filament_widget
      display_name: Filament Tracer
    - command: ibif-napari.secondary_widget
      display_name: Secondary objects
    - command: ibif-napari.measure_widget
      display_name: Measurements
    - command: ibif-napari.workspace_widget
      display_name: Workspace
