name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      # The tests stub Cellpose, so skip installing it (and PyTorch) here.
      - run: pip install "napari[pyqt5]" nd2 bioio-czi pytest pytest-qt && pip install -e . --no-deps
      - run: pytest -q
